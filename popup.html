<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UCSBPlat · GOLD sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-state="loading">
    <header class="site-header">
      <div class="site-brand"><img src="icons/icon128.png" width="40" height="40" alt="" /><span>UCSBPlat</span></div>
      <span class="header-label">GOLD sync</span>
    </header>
    <main>
      <section class="request-panel" aria-label="GOLD sync request">
        <div class="state-heading">
          <span class="state-icon" aria-hidden="true">
            <svg class="icon-sync" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 17.9 17" /></svg>
            <svg class="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg>
            <svg class="icon-alert" viewBox="0 0 24 24"><path d="M12 7v6m0 4h.01M10.3 3.8 2.4 17.5A2 2 0 0 0 4.1 20h15.8a2 2 0 0 0 1.7-2.5L13.7 3.8a2 2 0 0 0-3.4 0Z" /></svg>
            <svg class="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></svg>
          </span>
          <h1 id="stateLabel" class="state-label" aria-live="polite" aria-atomic="true">Checking request…</h1>
        </div>
        <div id="intro" class="intro" hidden>
          <h2>Your GOLD record.<br />Connected to your profile.</h2>
          <p>Choose an action on UCSBPlat to sync your schedule and major progress from GOLD.</p>
        </div>
        <div id="websiteAction" class="website-action" hidden>
          <h2 id="websiteActionTitle"></h2>
          <p id="websiteActionDetail"></p>
        </div>
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
        <p id="statusHint" class="status-hint" hidden></p>
        <div id="confirm" class="confirm" hidden>
          <h2>Replace your primary major?</h2>
          <p id="confirmMessage"></p>
          <div class="confirm-actions">
            <button id="confirmYes" type="button" class="button button-primary">Replace primary major</button>
            <button id="confirmNo" type="button" class="button">Keep saved major</button>
          </div>
        </div>
        <div class="request-actions">
          <button id="run" type="button" class="button button-primary" hidden>Continue</button>
          <button id="cancelWebsiteAction" type="button" class="button button-quiet" hidden>Cancel</button>
        </div>
      </section>
      <button id="website" type="button" class="button button-primary profile-button" hidden>Open ucsbplat.com</button>
    </main>
    <footer class="page-footer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4 8 9 8 9s8-5 8-9V6ZM9 12l2 2 4-4" /></svg>
      <span>GOLD pages are read only when you confirm.</span>
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
