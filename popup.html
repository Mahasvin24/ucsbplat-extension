<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>UCSBPlat</h1>
    <p id="stateLabel" class="state-label">Checking request…</p>
    <p id="intro">Use ucsbplat.com to choose what you'd like to do.</p>
    <div id="websiteAction" class="website-action" hidden>
      <strong id="websiteActionTitle"></strong>
      <p id="websiteActionDetail"></p>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="statusHint" class="status-hint" hidden></p>
    <div id="confirm" class="confirm" hidden>
      <p id="confirmMessage"></p>
      <button id="confirmYes" type="button">Confirm change</button>
      <button id="confirmNo" type="button" class="link">Cancel</button>
    </div>
    <button id="run" type="button" hidden>Continue</button>
    <button id="cancelWebsiteAction" type="button" class="link" hidden>Cancel</button>
    <button id="website" type="button">Open UCSBPlat</button>
    <script src="popup.js" type="module"></script>
  </body>
</html>
