<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>UCSBPlat · GOLD sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-state="loading">
    <header class="site-header">
      <div class="site-brand"><img src="icons/icon128.png" width="24" height="24" alt="" /><span>UCSBPlat</span></div>
      <span class="header-label">GOLD SYNC</span>
    </header>
    <main>
      <section class="request-content" aria-label="GOLD sync request">
        <div class="state-heading">
          <h1 id="stateLabel" class="state-label" aria-live="polite" aria-atomic="true">Checking request…</h1>
        </div>
        <div id="intro" class="intro" hidden>
          <h1>Sync starts on your profile.</h1>
          <p>Open UCSBPlat to choose the GOLD data you want to update.</p>
        </div>
        <div id="websiteAction" class="website-action" hidden>
          <h1 id="websiteActionTitle"></h1>
          <p id="websiteActionDetail"></p>
        </div>
        <div id="majorsSection" class="majors-section" hidden>
          <p class="section-label">Majors to sync</p>
          <ul id="majors"></ul>
        </div>
        <p id="status" class="status" role="status" aria-live="polite" hidden></p>
        <div id="progressArea" class="progress-area" hidden>
          <div class="progress-caption"><span id="progressLabel"></span><span>GOLD → UCSBPlat</span></div>
          <progress id="syncProgress" value="0" max="7" aria-label="Sync progress"></progress>
        </div>
        <p id="safeCloseNote" class="safe-close-note" hidden>It’s safe to close this window. Sync continues in the background. Keep the GOLD tab open.</p>
        <div id="confirm" class="confirm" hidden>
          <p id="confirmMessage"></p>
          <div class="confirm-actions">
            <button id="confirmYes" type="button" class="button button-primary">Replace primary major</button>
            <button id="confirmNo" type="button" class="button">Keep saved major</button>
          </div>
        </div>
        <div class="request-actions">
          <button id="run" type="button" class="button button-primary" hidden>Continue</button>
          <button id="cancelWebsiteAction" type="button" class="button button-quiet" hidden>Cancel</button>
        </div>
      </section>
      <button id="website" type="button" class="button button-primary profile-button" hidden>Open ucsbplat.com <span aria-hidden="true">↗</span></button>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
